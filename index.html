<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Subway-style map of every page across studiowetware.com, The Cyanotype Network, Small Works and Beach Self-Grading.">
<title>Studio Wetware Transit</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#121314">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0}

/* Layout: one-screen transit explorer. Header bar, the map fills the rest. Desktop: floating station window + right drawer. Phone: portrait map layout, bottom station panel, bottom lines/stations sheet. */
:root{
  --bg:#ffffff; --board:#fbfbf8; --ink:#1b1c1e; --muted:#62656b; --rule:#dcdcd6; --stn:#ffffff; --shade:rgba(20,20,20,.18);
  --display:"Overpass","Helvetica Neue",Arial,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  --red:#E3242B; --orange:#F28C28; --yellow:#F2BF00; --green:#00964A; --blue:#0072CE; --purple:#7B2D8E; --brown:#8C5A2B; --teal:#00A19C; --pink:#D6459B; --gray:#8A8D91; --focus:#0072CE; --here:#E3242B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121314;--board:#17181a;--ink:#ececE8;--muted:#a3a6ab;--rule:#2d2f32;--stn:#17181a;--brown:#B07A45;--shade:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121314;--board:#17181a;--ink:#ececE8;--muted:#a3a6ab;--rule:#2d2f32;--stn:#17181a;--brown:#B07A45;--shade:rgba(0,0,0,.5);color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45;overflow:hidden;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1500px;margin:0 auto}
.bar{display:flex;align-items:center;gap:6px 16px;border-bottom:3px solid var(--ink);padding-bottom:6px;min-width:0}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:none;border:0;color:var(--ink);font-family:var(--display);padding:2px 0;border-bottom:2px solid transparent}
.lg i{display:inline-block;width:18px;height:5px;border-radius:3px}
.lg[aria-pressed="true"]{border-bottom-color:var(--ink)}
.btn{font-family:var(--display);font-weight:600;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:8px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.board{position:relative;flex:1;min-height:0;background:var(--board);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grabbing{cursor:grabbing}
.ctrls{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3}
.ctrls .btn{width:40px;padding:0;font-size:18px;box-shadow:0 1px 4px var(--shade)}
.ctrls .btn.fit{font-size:12px}
.mini{position:absolute;left:10px;top:10px;z-index:3;background:var(--bg);border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 6px var(--shade);cursor:pointer;display:block}
.follow{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:3;display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700;font-size:13px;box-shadow:0 2px 8px var(--shade);white-space:nowrap}
.follow i{width:16px;height:5px;border-radius:3px}
.follow button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;height:28px;padding:0 10px;font-family:var(--display);font-weight:600;cursor:pointer}
/* station window */
.sheet{position:absolute;z-index:5;background:var(--bg);border:2px solid var(--ink);overflow:hidden;box-shadow:0 8px 24px var(--shade);display:flex;flex-direction:column}
.sheet.float{width:270px;border-radius:12px}
.sheet.bottom{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;border-width:2px 0 0;max-height:62%;padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y}
.sheet .grab{height:18px;display:flex;justify-content:center;align-items:center;flex:none}
.sheet .grab span{width:40px;height:4px;border-radius:2px;background:var(--rule)}
.sheet.float .grab{display:none}
.sheet .media{position:relative;flex:none}
.sheet .img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--board);border-bottom:1px solid var(--rule)}
.sheet.bottom .img{aspect-ratio:auto;height:min(26vh,190px)}
.sheet .noimg{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--board) 0 8px,var(--bg) 8px 16px);border-bottom:1px solid var(--rule)}
.sheet.bottom .noimg{aspect-ratio:auto;height:64px}
.sheet .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 1px 4px var(--shade);z-index:1}
.sheet.bottom .x{top:-2px}
.sheet .body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:12px;font-weight:600;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer}
.chip i{width:14px;height:5px;border-radius:3px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.youhere{align-self:flex-start;background:var(--here);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 10px;letter-spacing:.02em}
.tag-here rect{fill:var(--here)}
.tag-here text{fill:#fff;font-weight:800;font-family:var(--display)}
@media (prefers-reduced-motion:no-preference){.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}}
.sheet b{font-size:19px;font-weight:800;line-height:1.2}
.sheet .u{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;text-decoration:none}
.go.alt{background:var(--bg);color:var(--ink);border:1px solid var(--ink)}
.ride{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.ride button{font-family:var(--display);font-size:13px;font-weight:600;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ride button:last-child{text-align:right}
.ride button:disabled{opacity:.35;cursor:default}
.ride button span{font-size:11px;color:var(--muted);display:block;line-height:1;margin-top:3px;font-weight:400}
.sheet.float .ride{display:none}
.sheet.float.pinned .ride{display:grid}
.sheet.float:not(.pinned) .x,.sheet.float:not(.pinned) .chips{display:none}
/* lines & stations panel */
.panel{position:absolute;z-index:6;background:var(--bg);display:flex;flex-direction:column}
.panel.side{top:0;right:0;bottom:0;width:min(360px,100%);border-left:2px solid var(--ink)}
.panel.bottom{left:0;right:0;bottom:0;height:74%;border-top:2px solid var(--ink);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px var(--shade)}
.panel.bottom.half{height:46%}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--display);font-size:13px;font-weight:600;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{overflow-y:auto;padding:6px 12px 20px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.plist h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.plist p{font-size:12px;color:var(--muted);margin:8px 0 0}
.lrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 2px;font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.lrow i{width:28px;height:7px;border-radius:4px;flex:none}
.lrow em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-left:auto}
.srow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 0;font-family:var(--display);font-size:15px;color:var(--ink);cursor:pointer}
.srow .d{display:inline-flex;gap:2px;flex:none}
.srow .d i{width:8px;height:8px;border-radius:50%}
.srow em{font-style:normal;font-size:11px;color:var(--muted);margin-left:auto}
.back{font-family:var(--display);font-size:13px;font-weight:600;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0}
.strip{position:relative;margin:8px 0 0;padding:0;list-style:none}
.strip::before{content:"";position:absolute;left:11px;top:16px;bottom:16px;width:8px;border-radius:4px;background:var(--line,var(--ink))}
.strip li button{position:relative;display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:9px 0;font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.strip li button::before{content:"";flex:none;width:14px;height:14px;margin-left:5px;border-radius:50%;background:var(--stn);border:4px solid var(--ink);box-sizing:border-box;position:relative;z-index:1}
.strip li.hub button::before{width:20px;height:20px;margin-left:2px}
.strip li button small{font-weight:400;font-size:12px;color:var(--muted)}
svg text{font-family:var(--display)}
.lbl{font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-linejoin:round;cursor:pointer}
.hubl{font-weight:800}
.dom{font-family:var(--mono);font-weight:400;fill:var(--muted)}
.stn{cursor:pointer}
.stn:focus{outline:none}
.stn:focus-visible circle{stroke:var(--focus)}
@media (max-width:699px){
  body{padding-block:6px}
  .legend{display:none}
  h1{font-size:18px;flex:1}
  .ctrls{top:auto;bottom:12px;transform:none}
}
html.embed .bar,html.embed .privlink{display:none}
.privlink{position:absolute;left:10px;bottom:8px;z-index:3;font-size:11px;color:var(--ink);opacity:.65;background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;text-decoration:none;cursor:pointer}
.privlink:hover,.privlink:focus-visible{opacity:1}
.pv{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
.pv[hidden]{display:none}
.pv div{background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:14px;max-width:360px;padding:16px 18px;box-shadow:0 8px 24px var(--shade);font-size:14px;line-height:1.45}
.pv b{display:block;font-size:16px;margin-bottom:6px}
.pv p{margin:0 0 8px}
.pv button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Studio Wetware Transit Authority (S.We.T.A.) </h1>
    <div class="legend" id="legend" aria-label="Follow a line"></div>
    <button class="btn" id="linesBtn" aria-expanded="false">Lines &amp; stations</button>
  </div>
  <div class="board" id="board">
    <svg id="map" role="img" aria-label="Subway-style map of Studio Wetware web pages"></svg>
    <svg class="mini" id="mini" role="button" aria-label="Overview map: tap to move there" hidden></svg>
    <div class="follow" id="follow" hidden></div>
    <div class="ctrls">
      <button class="btn" id="zin" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" aria-label="Zoom out">−</button>
      <button class="btn fit" id="fit" aria-label="Show whole map">Fit</button>
    </div>
    <div class="sheet" id="sheet" hidden></div>
    <a class="privlink" id="privlink" href="?privacy=1">Privacy</a>
    <div class="pv" id="pv" hidden role="dialog" aria-label="Privacy"><div><b>Privacy</b><p>S.We.T.A. counts anonymous rides between stops. No names or emails, and your IP is never stored.</p><p>Turn on Do Not Track or Global Privacy Control and nothing is counted.</p><button type="button" id="pvx">Close</button></div></div>
    <aside class="panel" id="panel" hidden aria-label="Lines and stations">
      <header>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="lines" aria-selected="true">Lines</button>
          <button class="tab" role="tab" data-tab="all" aria-selected="false">Stations</button>
          <button class="tab" role="tab" data-tab="no" aria-selected="false">No image</button>
        </div>
        <button class="btn" id="closePanel" aria-label="Close">×</button>
      </header>
      <div class="plist" id="plist"></div>
    </aside>
  </div>
</div>

  el("rect",{x:vb.x,y:vb.y,width:vb.w,height:vb.h,fill:col("--ink"),"fill-opacity":.08,stroke:col("--ink"),"stroke-width":1.5*sw,rx:3*sw},mini);

mini.addEventListener("click",e=>{const r=mini.getBoundingClientRect(),v=mini.viewBox.baseVal;const x=v.x+(e.clientX-r.left)/r.width*v.width,y=v.y+(e.clientY-r.top)/r.height*v.height;animateTo(x,y,kNow())});

// ---------- view helpers ----------
function fitBox(x0,y0,x1,y1,opts={}){
  const R=rect(),mob=narrow();
  const panelH=(!panel.hidden&&panel.classList.contains("bottom"))?panel.offsetHeight:0;
  const L0=mob?14:30,Rt=mob?(opts.line?120:24):(lay==="wide"?(opts.line?215:180):170)+56,T=mob?(follow?52:14):(follow?56:30),Bt=(mob?(panelH?panelH+10:64):(lay==="wide"&&!opts.noBottomLabels?110:30))+(sheetOpenBottom()?sheet.offsetHeight:0);
  const k=Math.max((x1-x0)/Math.max(60,R.width-L0-Rt),(y1-y0)/Math.max(60,R.height-T-Bt),opts.minK||0);
  const cx=x0-L0*k+(R.width*k)/2+((R.width-L0-Rt)*k-(x1-x0))/2*0, cy=y0-T*k+(R.height*k)/2;
  vb={x:x0-L0*k-((R.width-L0-Rt)*k-(x1-x0))/2,y:y0-T*k-((R.height-T-Bt)*k-(y1-y0))/2,w:R.width*k,h:R.height*k};
}
function fitAll(){const B=bounds();fitBox(B.x0,B.y0,B.x1,B.y1);hideSheet(true);render()}
let anim=null;
function animateTo(cx,cy,k){
  const R=rect(),to={x:cx-R.width*k/2,y:cy-R.height*k/2,w:R.width*k,h:R.height*k};
  if(reduced){vb=to;render();return}
  const from={...vb},t0=performance.now();cancelAnimationFrame(anim);
  const step=t=>{const u=Math.min(1,(t-t0)/280),e=1-Math.pow(1-u,3);vb={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e};render();if(u<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function animateBox(x0,y0,x1,y1){const save={...vb};fitBox(x0,y0,x1,y1,{noBottomLabels:true,line:true});const to={...vb};vb=save;animateTo(to.x+to.w/2,to.y+to.h/2,to.w/rect().width)}
function zoomBy(f,cx,cy){const R=rect(),k=kNow(),nk=Math.min(Math.max(k*f,.35),6);const px=cx==null?vb.x+vb.w/2:vb.x+(cx-R.left)*k,py=cy==null?vb.y+vb.h/2:vb.y+(cy-R.top)*k;
  vb={x:px-(px-vb.x)*nk/k,y:py-(py-vb.y)*nk/k,w:R.width*nk,h:R.height*nk}}
const READ_K=1.05;
function centerStation(id){
  const p=P(id),R=rect(),k=Math.min(kNow(),READ_K*(narrow()?1:1.15));
  let cy=p[1];if(sheetOpenBottom()){const vis=R.height-sheet.offsetHeight;cy=p[1]+(R.height/2-vis/2)*k}
  animateTo(p[0],cy,k);
}

// ---------- station window ----------
const sheetOpenBottom=()=>!sheet.hidden&&sheet.classList.contains("bottom");
function rideFor(id){if(ride&&ORDER[ride]&&ORDER[ride].includes(id))return ride;if(follow&&ORDER[follow].includes(id))return follow;const ls=realLines(id).filter(l=>l.id!=="gray");return(ls[0]||linesAt(id)[0]).id}
function openStation(id,mode){
  if(mode!=="peek"&&(sel!==id||!pinned))track("station",id,"");
  sel=id;const s=S[id];const mob=narrow();pinned=mode!=="peek";ride=rideFor(id);
  const order=ORDER[ride],i=order.indexOf(id),prev=order[i-1],next=order[i+1],ln=L.find(l=>l.id===ride);
  const th=imgURL(s);
  sheet.className="sheet "+(mob?"bottom":"float")+(pinned?" pinned":"");
  sheet.innerHTML=`<div class="grab"><span></span></div><div class="media">${th?`<img class="img" src="${th}" alt="${s.n}" onerror="this.outerHTML='<div class=noimg>Image unavailable</div>'">`:`<div class="noimg">No featured image</div>`}<button class="x" aria-label="Close">×</button></div>
   <div class="body"><div class="chips">${linesAt(id).map(l=>`<button class="chip" data-ride="${l.id}" aria-pressed="${l.id===ride}"><i style="background:var(${l.c})"></i>${l.n}</button>`).join("")}</div>
   ${linksOf(id).length?`<div class="chips lk">${linksOf(id).map(q=>`<button class="chip" data-link="${q.id}">${q.t==="l"?"Learn link":"Connects to"}: ${S[q.id].n}</button>`).join("")}</div>`:""}${s.here?`<span class="youhere">You are here</span>`:""}<b>${s.n}${s.closed?" (closed)":""}</b><span class="u">${s.u.replace("https://","").replace(/\/$/,"")}</span>
   <div class="row2"><a class="go" href="${s.u}" target="_blank" rel="noopener">Visit page ↗</a>${s.live?`<a class="go alt" href="${s.live}" target="_blank" rel="noopener">Live site ↗</a>`:""}</div>
   <div class="ride" aria-label="Ride the ${ln.n} line"><button data-go="${prev||""}" ${prev?"":"disabled"}>← ${prev?S[prev].n:"End of line"}<span>${ln.n} line</span></button><button data-go="${next||""}" ${next?"":"disabled"}>${next?S[next].n:"End of line"} →<span>${ln.n} line</span></button></div></div>`;
  sheet.hidden=false;
  sheet.querySelector(".x").onclick=()=>hideSheet();
  sheet.querySelectorAll("[data-ride]").forEach(b=>b.onclick=()=>{ride=b.dataset.ride;openStation(id,"pin")});
  sheet.querySelectorAll("[data-link]").forEach(b=>b.onclick=()=>goTo(b.dataset.link));
  sheet.querySelectorAll(".ride [data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.go)goTo(b.dataset.go)});
  if(!mob)placeFloat(id);
  render();
}
function goTo(id){ride=ride&&ORDER[ride].includes(id)?ride:null;openStation(id,"pin");centerStation(id)}
function placeFloat(id){
  const p=P(id),R=rect(),k=kNow(),sx=(p[0]-vb.x)/k,sy=(p[1]-vb.y)/k,br=boardEl.getBoundingClientRect(),ox=R.left-br.left,oy=R.top-br.top;
  let x=ox+sx+22,y=oy+sy-60;if(x+sheet.offsetWidth>br.width-60)x=ox+sx-sheet.offsetWidth-22;
  sheet.style.left=Math.max(10,x)+"px";sheet.style.top=Math.min(Math.max(10,y),br.height-sheet.offsetHeight-10)+"px";
}
function hideSheet(silent){sheet.hidden=true;sel=null;pinned=false;if(!silent)render()}
// swipe the bottom panel: left/right rides the line, down closes
let sw0=null;
sheet.addEventListener("pointerdown",e=>{if(sheet.classList.contains("bottom")&&!e.target.closest("a,button"))sw0={x:e.clientX,y:e.clientY}});
sheet.addEventListener("pointerup",e=>{if(!sw0)return;const dx=e.clientX-sw0.x,dy=e.clientY-sw0.y;sw0=null;
  if(dy>60&&Math.abs(dy)>Math.abs(dx))hideSheet();
  else if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){const o=ORDER[ride],i=o.indexOf(sel),t=o[i+(dx<0?1:-1)];if(t)goTo(t)}});
// desktop hover preview
let hoverT=null;
svg.addEventListener("pointerover",e=>{if(e.pointerType!=="mouse"||narrow()||pinned)return;const g=e.target.closest("[data-id]");if(g&&g.dataset.id!==sel){clearTimeout(hoverT);openStation(g.dataset.id,"peek")}});
svg.addEventListener("pointerout",e=>{if(e.pointerType!=="mouse"||pinned)return;if(e.target.closest("[data-id]")){clearTimeout(hoverT);hoverT=setTimeout(()=>{if(!pinned&&!sheet.matches(":hover"))hideSheet()},250)}});
sheet.addEventListener("pointerenter",()=>clearTimeout(hoverT));
sheet.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!pinned)hoverT=setTimeout(()=>hideSheet(),250)});

// ---------- follow a line ----------
function setFollow(id){
  follow=id;panelLine=id;
  document.querySelectorAll(".lg").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.line===id)));
  if(!id){followEl.hidden=true;render();return}
  const l=L.find(x=>x.id===id);
  followEl.innerHTML=`<i style="background:var(${l.c})"></i>${l.n} line<button type="button">Done</button>`;followEl.hidden=false;
  followEl.querySelector("button").onclick=()=>{setFollow(null);if(!panel.hidden)drawPanel()};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;BR(l).forEach(br=>pts(br).forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}));
  hideSheet(true);animateBox(x0,y0,x1,y1);
}

// ---------- lines & stations panel ----------
const linesBtn=document.getElementById("linesBtn"),plist=document.getElementById("plist");
function openPanel(tab){panel.className="panel "+(narrow()?"bottom":"side");panel.hidden=false;linesBtn.setAttribute("aria-expanded","true");hideSheet(true);if(tab)panelTab=tab;drawPanel();render()}
function closePanel(){panel.hidden=true;linesBtn.setAttribute("aria-expanded","false")}
const dots=id=>`<span class="d">${linesAt(id).map(l=>`<i style="background:var(${l.c})"></i>`).join("")}</span>`;
function drawPanel(){
  panel.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===panelTab)));
  panel.classList.toggle("half",panelTab==="lines"&&!!panelLine);
  let h="";
  if(panelTab==="lines"&&panelLine){
    const l=L.find(x=>x.id===panelLine);
    h=`<button class="back" data-back>← All lines</button><h3>${l.n} line · ${ORDER[l.id].length} stops</h3><ol class="strip" style="--line:var(${l.c})">`+ORDER[l.id].map(id=>`<li class="${S[id].hub||S[id].xfer?"hub":""}"><button data-go="${id}"><span>${S[id].n}${linesAt(id).length>1?`<br><small>Change for ${linesAt(id).filter(x=>x.id!==l.id).map(x=>x.n).join(", ")}</small>`:""}</span></button></li>`).join("")+`</ol>`;
  }else if(panelTab==="lines"){
    h=`<p>Pick a line to follow it on the map and see its stops in order.</p>`+L.map(l=>`<button class="lrow" data-line="${l.id}"><i style="background:${l.dash?"repeating-linear-gradient(90deg,var(--teal) 0 6px,transparent 6px 10px)":"var("+l.c+")"}"></i>${l.n}<em>${ORDER[l.id].length} stops</em></button>`).join("");
  }else{
    if(panelTab==="no")h=`<p>These pages have no featured image set, or only the site logo.</p>`;
    for(const k in SITES){let ids=Object.keys(S).filter(i=>S[i].site===k);if(panelTab==="no")ids=ids.filter(i=>S[i].img===null||S[i].img==="logo");if(!ids.length)continue;
      h+=`<h3>${SITES[k]} · ${ids.length}</h3>`+ids.map(i=>`<button class="srow" data-go="${i}">${dots(i)}<span>${S[i].n}</span>${panelTab==="no"&&S[i].img==="logo"?"<em>site logo only</em>":""}</button>`).join("")}
  }
  plist.innerHTML=h;plist.scrollTop=0;
  plist.querySelector("[data-back]")?.addEventListener("click",()=>{panelLine=null;drawPanel()});
  plist.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{panelLine=b.dataset.line;drawPanel();setFollow(b.dataset.line)});
  plist.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(panelTab==="lines"&&panelLine)ride=panelLine;closePanel();openStation(id,"pin");centerStation(id)});
}
panel.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{panelTab=t.dataset.tab;drawPanel()});
linesBtn.onclick=()=>panel.hidden?openPanel():closePanel();
document.getElementById("closePanel").onclick=closePanel;

// legend chips (desktop) follow a line
const legend=document.getElementById("legend");
L.forEach(l=>{const b=document.createElement("button");b.className="lg";b.type="button";b.dataset.line=l.id;b.setAttribute("aria-pressed","false");b.title="Follow the "+l.n+" line";
  b.innerHTML=`<i style="background:${l.dash?"repeating-linear-gradient(90deg,var(--teal) 0 5px,transparent 5px 8px)":"var("+l.c+")"}"></i>${l.n}`;
  b.onclick=()=>setFollow(follow===l.id?null:l.id);legend.appendChild(b)});

// ---------- pan / zoom / tap ----------
const ptrs=new Map();let start=null,moved=false,pinch=null;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;cancelAnimationFrame(anim);
  if(ptrs.size===2){const a=[...ptrs.values()];pinch={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),k:kNow()}}
  start={x:e.clientX,y:e.clientY,vb:{...vb},g:e.target.closest("[data-id]")};svg.classList.add("grabbing")});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pinch){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoomBy(pinch.k*pinch.d/d/kNow(),(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);moved=true;if(sheet.classList.contains("float"))hideSheet(true);render();return}
  if(!start||ptrs.size>1)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>6)moved=true;if(!moved)return;
  const k=kNow();vb.x=start.vb.x-dx*k;vb.y=start.vb.y-dy*k;if(sheet.classList.contains("float")&&!sheet.hidden)hideSheet(true);render()});
function end(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;svg.classList.remove("grabbing");
  if(start&&!moved&&ptrs.size===0){if(start.g){const id=start.g.dataset.id;openStation(id,"pin");if(narrow())centerStation(id)}else if(!sheet.hidden)hideSheet()}
  if(!ptrs.size)start=null}
svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY>0?1.12:.89,e.clientX,e.clientY);if(sheet.classList.contains("float"))hideSheet(true);render()},{passive:false});
svg.addEventListener("keydown",e=>{const g=e.target.closest(".stn");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openStation(g.dataset.id,"pin");sheet.querySelector(".go")?.focus()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!panel.hidden)closePanel();else if(!sheet.hidden)hideSheet();else if(follow)setFollow(null)}
  if(!sheet.hidden&&pinned&&(e.key==="ArrowRight"||e.key==="ArrowLeft")&&!e.target.closest("input")){const o=ORDER[ride],i=o.indexOf(sel),t=o[i+(e.key==="ArrowRight"?1:-1)];if(t)goTo(t)}});
document.getElementById("zin").onclick=()=>{zoomBy(.75);render()};
document.getElementById("zout").onclick=()=>{zoomBy(1.33);render()};
document.getElementById("fit").onclick=()=>{setFollow(null);fitAll()};

// ---------- rider counting (off until an endpoint is set) ----------
const TRACK_URL="https://sweta-tracker.kbmallonee.workers.dev";
let RID="",OPTOUT=false,HEAT=null;
try{OPTOUT=navigator.doNotTrack==="1"||window.doNotTrack==="1"||navigator.globalPrivacyControl===true}catch(e){}
(function(){
  if(!TRACK_URL||OPTOUT)return;
  try{
    const q=new URLSearchParams(location.search),h=q.get("swt");
    if(h&&/^[a-z0-9]{8,32}$/.test(h))localStorage.setItem("swt_rid",h);
    RID=localStorage.getItem("swt_rid")||"";
    if(!/^[a-z0-9]{8,32}$/.test(RID)){const a=new Uint8Array(16);crypto.getRandomValues(a);RID=[...a].map(v=>(v%36).toString(36)).join("");localStorage.setItem("swt_rid",RID)}
  }catch(e){RID=""}
})();
const hand=u=>RID?u+(u.includes("?")?"&":"?")+"swt="+RID:u;
function track(t,stop,to){
  if(!TRACK_URL||OPTOUT||!RID)return;
  try{
    const body=JSON.stringify({t,s:stop||"",o:to||"",r:RID,h:location.hostname,p:location.pathname,k:"map"});
    if(navigator.sendBeacon&&navigator.sendBeacon(TRACK_URL+"/hit",new Blob([body],{type:"text/plain"})))return;
    fetch(TRACK_URL+"/hit",{method:"POST",body,keepalive:true,mode:"cors",headers:{"content-type":"text/plain"}}).catch(()=>{});
  }catch(e){}
}
if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embed");
// privacy notice
const pv=document.getElementById("pv");
const showPrivacy=()=>{pv.hidden=false;document.getElementById("pvx").focus()};
document.getElementById("privlink").onclick=e=>{e.preventDefault();showPrivacy()};
document.getElementById("pvx").onclick=()=>{pv.hidden=true};
pv.addEventListener("click",e=>{if(e.target===pv)pv.hidden=true});
// links out of the map carry the rider ID and are counted
sheet.addEventListener("click",e=>{const a=e.target.closest("a.go");if(!a)return;
  track("click","map",sel||"");
  if(RID&&a.href&&!/[?&]swt=/.test(a.href))a.href=hand(a.href)});
// heat overlay: the private dashboard sends counts to this page when it embeds it
addEventListener("message",e=>{
  const d=e.data;if(!d||d.swt!=="heat"||e.source!==parent||parent===window)return;
  HEAT=d.data&&Object.keys(d.data).length?d.data:null;render();
});
if(new URLSearchParams(location.search).get("privacy")==="1")showPrivacy();
track("view","map","");

// ---------- start ----------
function startView(){
  lay=pickLayout();
  if(narrow()){const p=P("SW");setView(p[0]+(lay==="tall"?-10:110),p[1]+20,READ_K)}else{const B=bounds();fitBox(B.x0,B.y0,B.x1,B.y1)}
  render();
}
let lastLay=null,rT=null;
addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{const nl=pickLayout();if(nl!==lay||lastLay===null){hideSheet(true);if(!panel.hidden)openPanel();startView()}else{const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2},k=vb.w/(vb.w/kNow());const R=rect(),kk=Math.max(vb.w/R.width,.35);setView(c.x,c.y,kk);render()}lastLay=lay},120)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
startView();lastLay=lay;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
</script>
</body>
