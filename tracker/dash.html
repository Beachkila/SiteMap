<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>S.We.T.A. Ridership</title>
<style>
:root{--bg:#141413;--panel:#1c1c1a;--panel2:#242421;--ink:#ecebe6;--muted:#9a9a93;--rule:#33332f;--amber:#f2b134;--hot:#e5483b;--ok:#6fbf73;
  --mono:ui-monospace,Menlo,Consolas,monospace;--sans:"Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;border-bottom:3px solid var(--ink)}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.sp{flex:1}
select,button,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
nav{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--rule);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted);font-weight:700;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--amber)}
main{padding:16px;max-width:1400px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:24px;font-family:var(--mono);line-height:1.1}
.card span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.box h2{margin:0;padding:10px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center}
.box h2 .sp{flex:1}
iframe{display:block;width:100%;height:560px;border:0;background:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--amber);vertical-align:middle;min-width:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.pill.hot{color:var(--hot);border-color:var(--hot)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.ok{color:var(--ok);border-color:var(--ok)}
.muted{color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.tl{padding:8px 12px 12px}
.tl .sess{margin:10px 0 4px;font-weight:700;font-size:12px;color:var(--amber);font-family:var(--mono)}
.tl .ev{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:3px 0 3px 12px;border-left:2px solid var(--rule);font-size:13px}
.tl .ev .t{white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:12px}
.tl .ev.click{border-left-color:var(--amber)}
.tl .ev.click .what{color:var(--amber)}
.spark{display:flex;align-items:flex-end;gap:2px;height:60px;padding:8px 12px}
.spark i{flex:1;background:var(--amber);min-width:2px;border-radius:2px 2px 0 0;opacity:.85}
.build{padding:0}
.build .it{padding:10px 12px;border-bottom:1px solid var(--rule)}
.build .it:last-child{border:0}
.build .it b{display:block}
#login{max-width:420px;margin:60px auto;padding:20px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
#login input{width:100%;margin:10px 0}
.err{color:var(--hot)}
</style>
</head>
<body>
<header>
  <h1>S.We.T.A. Ridership<small>private</small></h1>
  <span class="sp"></span>
  <label class="muted">Period <select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></label>
  <button id="refresh">Refresh</button>
  <button id="csv">Export CSV</button>
  <button id="json">Export JSON</button>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var TOKEN = ""; try { TOKEN = sessionStorage.getItem("swt_tok") || ""; } catch (e) {}
  var META = null, SUM = null, RIDERS = null, TAB = "heat", METRIC = "views", SORT = { k: "visits", d: -1 };

  var TABS = [["heat", "Heat map"], ["stations", "Stations"], ["riders", "Riders"], ["flows", "Flows"], ["build", "Build out"]];
  $("#tabs").innerHTML = TABS.map(function (t) { return '<button role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === TAB) + '">' + t[1] + "</button>"; }).join("");
  $("#tabs").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; TAB = b.dataset.t; [].forEach.call($("#tabs").children, function (x) { x.setAttribute("aria-selected", x === b); }); draw(); };

  function api(path) {
    var h = TOKEN ? { authorization: "Bearer " + TOKEN } : {};
    return fetch(path, { headers: h, cache: "no-store", credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { var e = new Error("unauthorized"); e.code = 401; throw e; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r;
    });
  }
  function days() { return $("#days").value; }
  function load() {
    $("#main").innerHTML = '<div class="empty">Loading…</div>';
    return Promise.all([META ? META : api("/api/meta").then(function (r) { return r.json(); }), api("/api/summary?days=" + days()).then(function (r) { return r.json(); }), api("/api/riders?days=" + days()).then(function (r) { return r.json(); })])
      .then(function (a) { META = a[0]; SUM = a[1]; RIDERS = a[2].riders; draw(); })
      .catch(function (e) { if (e.code === 401) login(); else $("#main").innerHTML = '<div class="empty err">Could not load: ' + esc(e.message) + "</div>"; });
  }
  function login(msg) {
    $("#main").innerHTML = '<div id="login"><b>Read token</b><p class="muted">This page is behind Cloudflare Access. If you are seeing this, paste the read token instead.</p><input id="tok" type="password" autocomplete="off" placeholder="READ_TOKEN"><button id="go">Open</button><p class="err">' + esc(msg || "") + "</p></div>";
    $("#go").onclick = function () { TOKEN = $("#tok").value.trim(); try { sessionStorage.setItem("swt_tok", TOKEN); } catch (e) {} load(); };
  }

  var nm = function (id) { return META.stops[id] ? META.stops[id].n : id; };
  var lineOf = function (id) { var s = META.stops[id]; if (!s || !s.lines.length) return null; for (var i = 0; i < META.lines.length; i++) if (s.lines.indexOf(META.lines[i].id) > -1) return META.lines[i]; return null; };
  var dotFor = function (id) { var l = lineOf(id); return '<i class="dot" style="background:' + (l ? l.c : "#777") + '"></i>'; };
  var num = function (n) { return Number(n || 0).toLocaleString(); };
  var pct = function (a, b) { return b ? Math.round(100 * a / b) + "%" : "–"; };
  var when = function (ts) { var d = new Date(ts); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };

  function rows() {
    var out = [];
    Object.keys(META.stops).forEach(function (id) {
      var s = SUM.stops[id] || { views: 0, riders: 0, entries: 0, exits: 0, bounces: 0, clicksOut: 0 };
      out.push({ id: id, name: nm(id), views: s.views, riders: s.riders, entries: s.entries, exits: s.exits, bounces: s.bounces, clicksOut: s.clicksOut });
    });
    return out;
  }
  function cards() {
    var t = SUM.totals;
    return '<div class="cards">' + [["Riders", t.riders], ["Trips", t.sessions], ["Stop visits", t.visits], ["Moves between stops", t.moves], ["Moves using S.We.T.A.", t.assistedMoves], ["Cross-site moves", t.crossSiteMoves]]
      .map(function (c) { return '<div class="card"><b>' + num(c[1]) + "</b><span>" + c[0] + "</span></div>"; }).join("") + "</div>";
  }
  function spark() {
    var t = SUM.trend || []; if (!t.length) return "";
    var mx = Math.max.apply(null, t.map(function (d) { return d.visits; })) || 1;
    return '<div class="box" style="margin-bottom:16px"><h2>Visits per day</h2><div class="spark">' + t.map(function (d) { return '<i title="' + d.day + ": " + d.visits + ' visits, ' + d.riders + ' riders" style="height:' + Math.max(3, 100 * d.visits / mx) + '%"></i>'; }).join("") + "</div></div>";
  }

  function draw() {
    if (!META || !SUM) return;
    var m = $("#main"); m.onclick = null;
    if (TAB === "heat") {
      var r = rows().sort(function (a, b) { return b[METRIC] - a[METRIC]; }), mx = (r[0] && r[0][METRIC]) || 1;
      m.innerHTML = cards() + spark() + '<div class="grid"><div class="box"><h2>Busiest stations<span class="sp"></span><select id="metric"><option value="views">Visits</option><option value="riders">Riders</option><option value="entries">Entries</option></select></h2><iframe id="map" title="Map" src="' + esc(META.map) + '?embed=1"></iframe></div>' +
        '<div class="box"><h2>Ranking</h2><table>' + r.filter(function (x) { return x[METRIC] > 0; }).slice(0, 25).map(function (x) {
          return '<tr class="click" data-s="' + x.id + '"><td>' + dotFor(x.id) + esc(x.name) + '</td><td class="n">' + num(x[METRIC]) + '</td><td style="width:30%"><span class="bar" style="width:' + Math.max(2, 100 * x[METRIC] / mx) + '%"></span></td></tr>';
        }).join("") + (r.some(function (x) { return x[METRIC] > 0; }) ? "" : '<tr><td class="empty">No rides counted yet.</td></tr>') + "</table></div></div>";
      $("#metric").value = METRIC; $("#metric").onchange = function () { METRIC = this.value; draw(); };
      var f = $("#map"), send = function () { var d = {}; rows().forEach(function (x) { if (x[METRIC] > 0) d[x.id] = x[METRIC]; }); try { f.contentWindow.postMessage({ swt: "heat", data: d }, "*"); } catch (e) {} };
      f.onload = function () { send(); setTimeout(send, 600); };
    } else if (TAB === "stations") {
      var rs = rows(); rs.forEach(function (x) { x.bouncePct = x.entries ? x.bounces / x.entries : 0; x.exitPct = x.views ? x.exits / x.views : 0; });
      rs.sort(function (a, b) { var A = a[SORT.k], B = b[SORT.k]; return (typeof A === "string" ? A.localeCompare(B) : A - B) * SORT.d; });
      var cols = [["name", "Station"], ["views", "Visits"], ["riders", "Riders"], ["entries", "Entries"], ["exits", "Exits"], ["bounces", "Bounces"], ["clicksOut", "Map/strip clicks"]];
      m.innerHTML = '<div class="box"><h2>All stations</h2><div style="overflow-x:auto"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[0] === "name" ? "" : "n") + '" data-k="' + c[0] + '">' + c[1] + (SORT.k === c[0] ? (SORT.d < 0 ? " ▾" : " ▴") : "") + "</th>"; }).join("") + "</tr></thead><tbody>" +
        rs.map(function (x) { return "<tr><td>" + dotFor(x.id) + esc(x.name) + '</td><td class="n">' + num(x.views) + '</td><td class="n">' + num(x.riders) + '</td><td class="n">' + num(x.entries) + '</td><td class="n">' + num(x.exits) + '</td><td class="n">' + num(x.bounces) + '</td><td class="n">' + num(x.clicksOut) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
      m.querySelector("thead").onclick = function (e) { var th = e.target.closest("th"); if (!th) return; SORT = { k: th.dataset.k, d: SORT.k === th.dataset.k ? -SORT.d : -1 }; draw(); };
    } else if (TAB === "riders") {
      m.innerHTML = '<div class="grid"><div class="box"><h2>Riders <span class="muted">(anonymous)</span></h2><div style="overflow-x:auto"><table><thead><tr><th>Rider</th><th>Last seen</th><th class="n">Trips</th><th class="n">Visits</th><th class="n">Stops</th><th class="n">Sites</th><th class="n">Clicks</th></tr></thead><tbody>' +
        (RIDERS.length ? RIDERS.map(function (x) { return '<tr class="click" data-r="' + x.id + '"><td style="font-family:var(--mono)">' + x.id.slice(0, 8) + "</td><td>" + when(x.last) + '</td><td class="n">' + x.sessions + '</td><td class="n">' + x.visits + '</td><td class="n">' + x.stops + '</td><td class="n">' + x.sites + '</td><td class="n">' + x.clicks + "</td></tr>"; }).join("") : '<tr><td colspan="7" class="empty">No riders yet.</td></tr>') +
        '</tbody></table></div></div><div class="box"><h2>Journey</h2><div id="jny" class="empty">Pick a rider.</div></div></div>';
      m.onclick = function (e) { var tr = e.target.closest("tr[data-r]"); if (!tr) return; journey(tr.dataset.r); };
    } else if (TAB === "flows") {
      var fl = SUM.flows;
      m.innerHTML = '<div class="box"><h2>Moves between stations <span class="muted">(assisted = used the strip or map)</span></h2><div style="overflow-x:auto"><table><thead><tr><th>From</th><th>To</th><th class="n">Moves</th><th class="n">Assisted</th><th class="n">Cross-site</th><th></th></tr></thead><tbody>' +
        (fl.length ? fl.slice(0, 80).map(function (f) { return "<tr><td>" + dotFor(f.from) + esc(nm(f.from)) + "</td><td>" + dotFor(f.to) + esc(nm(f.to)) + '</td><td class="n">' + f.n + '</td><td class="n">' + f.assisted + " (" + pct(f.assisted, f.n) + ')</td><td class="n">' + f.cross + '</td><td style="width:20%"><span class="bar" style="width:' + Math.max(3, 100 * f.n / fl[0].n) + '%"></span></td></tr>'; }).join("") : '<tr><td colspan="6" class="empty">No moves counted yet.</td></tr>') + "</tbody></table></div></div>";
    } else if (TAB === "build") {
      buildOut(m);
    }
    var tr = m.querySelectorAll("tr[data-s]"); [].forEach.call(tr, function (r) { r.onclick = function () { TAB = "stations"; [].forEach.call($("#tabs").children, function (x) { x.setAttribute("aria-selected", x.dataset.t === TAB); }); draw(); }; });
  }

  function journey(id) {
    var box = $("#jny"); box.className = ""; box.innerHTML = '<div class="empty">Loading…</div>';
    api("/api/rider?id=" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
      box.innerHTML = '<div class="tl">' + d.sessions.map(function (s, i) {
        return '<div class="sess">Trip ' + (i + 1) + " · " + when(s.start) + " · " + Math.max(1, Math.round((s.end - s.start) / 60000)) + " min</div>" + s.events.map(function (e) {
          var t = new Date(e.ts).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          var what = e.type === "click" ? "Used S.We.T.A.: " + esc(e.stop === "map" ? "map" : nm(e.stop)) + " → " + esc(e.to_stop === "map" ? "map" : nm(e.to_stop)) : (e.type === "station" ? "Opened " : "Visited ") + esc(nm(e.stop)) + ' <span class="muted">' + esc((e.host || "") + (e.path || "")) + "</span>";
          return '<div class="ev ' + e.type + '"><span class="t">' + t + '</span><span class="what">' + what + "</span></div>";
        }).join("");
      }).join("") + "</div>";
    }).catch(function (e) { box.innerHTML = '<div class="empty err">' + esc(e.message) + "</div>"; });
  }

  // Where to build: plain rules over the numbers, each with the reason shown.
  function buildOut(m) {
    var rs = rows(), items = [], total = SUM.totals.visits;
    var by = {}; rs.forEach(function (x) { by[x.id] = x; });
    if (total < 20) {
      m.innerHTML = cards() + '<div class="box"><h2>Where to build out</h2><div class="empty">Not enough rides yet. Suggestions start once there are about 20 stop visits.</div></div>'; return;
    }
    var live = rs.filter(function (x) { return !(META.stops[x.id] || {}).closed; });
    var avg = total / Math.max(1, live.length);
    live.forEach(function (x) {
      var s = META.stops[x.id];
      if (x.views >= avg * 1.5 && x.entries && x.exits / x.views > 0.7 && x.clicksOut === 0)
        items.push({ w: x.views, tag: "hot", t: "Dead end: " + x.name, d: x.views + " visits, " + pct(x.exits, x.views) + " of them end here and nobody used the strip or map. Add a visible next stop." });
      if (x.entries >= 5 && x.bounces / x.entries > 0.7)
        items.push({ w: x.entries, tag: "amber", t: "Leaves quickly: " + x.name, d: pct(x.bounces, x.entries) + " of " + x.entries + " arrivals saw only this page. The entrance may not match what people expect." });
    });
    var none = live.filter(function (x) { return x.views === 0; });
    if (none.length) items.push({ w: 2, tag: "", t: "No visits in " + SUM.days + " days (" + none.length + " stations)", d: none.map(function (x) { return x.name; }).join(", ") });
    SUM.flows.forEach(function (f) {
      var a = META.stops[f.from], b = META.stops[f.to];
      if (!a || !b || f.n < 3) return;
      var shared = a.lines.some(function (l) { return b.lines.indexOf(l) > -1; });
      var linked = (META.links || []).some(function (k) { return (k[0] === f.from && k[1] === f.to) || (k[1] === f.from && k[0] === f.to); });
      if (linked) return;
      if (!shared) items.push({ w: f.n, tag: "ok", t: "Riders already cross: " + nm(f.from) + " → " + nm(f.to), d: f.n + " moves between stops on different lines" + (f.assisted ? ", " + f.assisted + " using S.We.T.A" : "") + ". A transfer or a direct link would make this official." });
    });
    var unassisted = SUM.totals.moves - SUM.totals.assistedMoves;
    if (SUM.totals.moves >= 10 && unassisted / SUM.totals.moves > 0.7)
      items.push({ w: unassisted, tag: "amber", t: "Strip is under-used", d: pct(unassisted, SUM.totals.moves) + " of moves between stops did not go through the strip or map." });
    items.sort(function (a, b) { return b.w - a.w; });
    m.innerHTML = cards() + '<div class="box build"><h2>Where to build out <span class="muted">(rules on the numbers, not predictions)</span></h2>' +
      (items.length ? items.slice(0, 30).map(function (i) { return '<div class="it"><b>' + esc(i.t) + (i.tag ? ' <span class="pill ' + i.tag + '">' + (i.tag === "hot" ? "fix" : i.tag === "ok" ? "opportunity" : "watch") + "</span>" : "") + '</b><span class="muted">' + esc(i.d) + "</span></div>"; }).join("") : '<div class="empty">Nothing stands out.</div>') + "</div>";
  }

  function download(fmt) {
    api("/api/export?days=" + days() + "&format=" + fmt).then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "sweta-events." + fmt; document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { alert(e.message); });
  }
  $("#refresh").onclick = load; $("#days").onchange = load;
  $("#csv").onclick = function () { download("csv"); }; $("#json").onclick = function () { download("json"); };
  load();
})();
</script>
</body>
</html>
