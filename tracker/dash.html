<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>S.We.T.A. Ridership</title>
<style>
:root{--bg:#121211;--panel:#1b1b19;--panel2:#252522;--ink:#ecebe6;--muted:#9a9a93;--rule:#34342f;--accent:#f2b134;--hot:#e5483b;--ok:#6fbf73;--live:#4fd1c5;
  --mono:ui-monospace,Menlo,Consolas,monospace;--sans:"Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-bottom:3px solid var(--ink)}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.sp{flex:1}
select,button,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#liveTag{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
#liveTag i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
#liveTag.on i{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:beat 1.6s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(79,209,197,.6)}70%{box-shadow:0 0 0 8px rgba(79,209,197,0)}100%{box-shadow:0 0 0 0 rgba(79,209,197,0)}}
nav{display:flex;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--rule);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted);font-weight:700;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:24px;font-family:var(--mono);line-height:1.1}
.card span{color:var(--muted);font-size:12px}
.card em{font-style:normal;font-size:11px;font-family:var(--mono);margin-left:6px}
.up{color:var(--ok)}.down{color:var(--hot)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:16px}
.box h2{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box h2 .sp{flex:1}
.pad{padding:10px 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--panel2)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;min-width:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.pill.hot{color:var(--hot);border-color:var(--hot)}.pill.amber{color:var(--accent);border-color:var(--accent)}.pill.ok{color:var(--ok);border-color:var(--ok)}
.muted{color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.err{color:var(--hot)}
/* map */
.mapwrap{position:relative;height:620px;background:#0d0d0c;touch-action:none}
.mapwrap svg{display:block;width:100%;height:100%;cursor:grab}
.mapwrap svg.drag{cursor:grabbing}
.tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:13px}
.tools label{display:flex;align-items:center;gap:5px;color:var(--muted)}
.tools select{padding:3px 6px}
.tools .seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tools .seg button{border:0;border-radius:0;padding:3px 9px;background:var(--panel2)}
.tools .seg button.on{background:var(--ink);color:var(--bg)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;padding:0;font-size:18px;font-weight:700}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(18,18,17,.88);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12px;max-width:360px}
.legend .grad{height:10px;border-radius:5px;margin:4px 0 2px;width:220px}
.legend .row{display:flex;justify-content:space-between;width:220px;font-family:var(--mono);color:var(--muted)}
.lbl{font:600 12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#0d0d0c;stroke-width:3px;pointer-events:none}
.side h3{margin:0 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-family:var(--mono);font-size:17px}
.kv span{font-size:11px;color:var(--muted)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule);font-size:13px}
.list li .n{margin-left:auto;font-family:var(--mono)}
.feed li{animation:fadein .6s}
@keyframes fadein{from{background:rgba(79,209,197,.25)}to{background:transparent}}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 0 0}
.cols div{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.cols span{white-space:nowrap;font-size:10px;color:var(--muted);font-family:var(--mono)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:5px}
.keys b{width:10px;height:10px;border-radius:3px;display:inline-block}
.world{height:440px;background:#d6d1c6}
.world svg{width:100%;height:100%;display:block}
.world .empty{color:#6a655c}
.steps{display:flex;gap:4px;font:11px var(--mono);color:var(--muted)}
.steps span{flex:1;display:flex;flex-direction:column;gap:4px}
.steps span:first-child{flex:0 0 56px}
.steps i{display:block;height:10px;border-radius:2px}
.colsx{display:flex;gap:3px;height:120px;align-items:flex-end;padding-top:8px;border-bottom:1px solid var(--rule)}
.colsx i{flex:1;display:block;border-radius:3px 3px 0 0}
.axis{display:flex;gap:3px;margin-top:5px}
.axis span{flex:1;min-width:0;text-align:center;white-space:nowrap;font-size:10px;color:var(--muted);font-family:var(--mono)}
.tl{padding:8px 12px 12px}
.tl .sess{margin:10px 0 4px;font-weight:700;font-size:12px;color:var(--accent);font-family:var(--mono);display:flex;gap:8px;align-items:center}
.tl .ev{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:3px 0 3px 12px;border-left:2px solid var(--rule);font-size:13px}
.tl .ev .t{white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:12px}
.tl .ev.click{border-left-color:var(--accent)}
.tl .ev.click .what{color:var(--accent)}
.build .it{padding:10px 12px;border-bottom:1px solid var(--rule)}
.build .it:last-child{border:0}
.build .it b{display:block}
#login{max-width:420px;margin:60px auto;padding:20px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
#login input{width:100%;margin:10px 0}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-size:12px;z-index:9;display:none}
.note{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.card .vs{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.mapwrap.full{position:fixed;inset:0;height:auto;z-index:30}
.fullbtn{position:absolute;left:10px;top:10px;padding:5px 10px;font-size:13px}
.phonemap .mapwrap{height:300px}
.phonemap .legend{display:none}
.phonemap .mapwrap.full .legend{display:block}
details.opts summary{padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:1px solid var(--rule)}
@media(max-width:700px){
  header{padding:10px 12px;gap:8px}
  header h1{width:100%}
  header .sp{display:none}
  #csv,#json{display:none}
  nav{padding:4px 8px 0;scrollbar-width:none}
  nav button{padding:8px 10px}
  main{padding:10px}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .card b{font-size:20px}
  .grid2{grid-template-columns:1fr}
  th,td{padding:6px 7px}
  .kv{grid-template-columns:repeat(2,1fr)}
  .world{height:260px}
  .tl .ev{grid-template-columns:70px 1fr}
}
.rkw tr.more{display:none}.rkw.open tr.more{display:table-row}
.showall{display:block;width:calc(100% - 24px);margin:8px 12px 12px;color:#4ea1ff;font-weight:700;background:var(--panel2)}
#pextra{display:flex;gap:6px;align-items:center}
#pextra input{width:150px}
.login-keep{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--ink)}
.login-keep input{width:20px;height:20px}
/* ---------- phone: board, sheets, tab bar ---------- */
.seg{display:none}
.tabbar,.sheet,.sheetdim{display:none}
@media(max-width:700px){
  nav,#plabel,#pextra,#glabel,#forget,#refresh{display:none!important}
  header{border-bottom:0;padding:8px 12px 0;flex-wrap:nowrap}
  header h1{width:auto;font-size:20px;white-space:nowrap}
  #liveTag{margin-left:auto;white-space:nowrap}
  header h1 small{display:none}
  main{padding:0 12px 100px}
  .seg{display:flex;background:var(--panel2);border-radius:10px;padding:2px;margin:6px 0 10px;position:sticky;top:0;z-index:5}
  .seg button{flex:1;border:0;background:none;padding:7px 0;font-weight:700;font-size:13px;color:var(--muted);border-radius:8px}
  .seg button.on{background:#3a3a37;color:var(--ink)}
  .seg button.cal{flex:0 0 42px}
  .seg+.pnote{margin:-6px 2px 10px;font-size:12px;color:var(--muted)}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:9px 11px;cursor:pointer;min-width:0;overflow:hidden}
  .tile h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .tile h3 .ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#000;font-weight:800;flex:none}
  .tile h3::after{content:"›";margin-left:auto;font-size:18px;line-height:10px;color:#555}
  .tile .big{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .tile .vs{margin-top:0}
  .tile .spk{display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:5px}
  .tile .spk i{flex:1;border-radius:2px 2px 0 0;min-height:0}
  .tile .rw{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:1px 0}
  .tile .rw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .ln{font-size:12px;display:flex;justify-content:space-between;gap:6px}
  .tile .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .lb{height:5px;border-radius:3px;background:var(--panel2);margin:2px 0 4px;overflow:hidden}.tile .lb i{display:block;height:100%}
  .tile .wm{width:100%;height:50px;border-radius:8px;background:#d6d1c6;display:block}
  .tile .sm{font-size:12px;color:var(--muted)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(27,27,25,.96);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(10px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:2px 8px}
  .tabbar button b{font-size:20px;line-height:22px;font-weight:400}
  .tabbar button.on{color:var(--accent)}
  .sheetdim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  .sheet.open{display:block;position:fixed;left:0;right:0;bottom:0;top:44px;z-index:31;background:var(--bg);border-radius:14px 14px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 40px}
  .sheet .sh{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 4px 8px}
  .sheet .grab{width:38px;height:5px;border-radius:3px;background:#555;margin:0 auto 8px}
  .sheet .sh div{display:flex;align-items:center;justify-content:space-between}
  .sheet .sh h2{margin:0;font-size:22px}
  .sheet .sh button{border:0;background:var(--panel2);border-radius:50%;width:30px;height:30px;padding:0;font-size:16px}
  .more-list button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 12px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:var(--panel);font-size:16px;text-align:left}
  .more-list button:first-child{border-radius:12px 12px 0 0}.more-list button:last-child{border-radius:0 0 12px 12px;border-bottom:0}
  .more-list button::after{content:"›";color:#555;font-size:20px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mgrid button{padding:12px 0;font-weight:700;border-radius:10px}
  .mgrid button.on{background:var(--accent);color:#000;border-color:var(--accent)}
  .dates label{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:8px}
  .bigbtn{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;background:var(--accent);color:#000;border:0;margin-top:10px}
}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--rule);vertical-align:-2px;margin-right:6px}
</style>
</head>
<body>
<header>
  <h1>S.We.T.A. Ridership<small>private</small></h1>
  <span id="liveTag" title="Checks for new riders every 20 seconds"><i></i><span>Live</span></span>
  <span class="sp"></span>
  <label class="muted" id="plabel">Period <select id="days"><option value="1">24 hours</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option><option value="month">A month…</option><option value="custom">Date range…</option></select></label>
  <span id="pextra"></span>
  <label class="muted" id="glabel" hidden>By <select id="group"><option value="">auto</option><option value="day">day</option><option value="week">week</option><option value="month">month</option></select></label>
  <button id="refresh">Refresh</button>
  <button id="csv">Export CSV</button>
  <button id="json">Export JSON</button>
  <button id="forget" hidden title="Remove the saved token from this browser">Forget this device</button>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
<div class="sheetdim" id="sdim"></div><div class="sheet" id="sheet"></div>
<div class="tabbar" id="tabbar"></div>
<div class="tip" id="tip"></div>

    world().then(function (topo) {
      var box = $("#world"); if (!box || !window.d3 || !window.topojson) return;
      var W = box.clientWidth, H = box.clientHeight, feats = topojson.feature(topo, topo.objects.countries).features.filter(function (f) { return f.id !== "010"; });
      var proj = d3.geoNaturalEarth1().fitSize([W, H], { type: "FeatureCollection", features: feats }), path = d3.geoPath(proj);
      var byNum = {}; Object.keys(c).forEach(function (k) { if (ISO[k]) byNum[ISO[k]] = k; });
      box.innerHTML = "";
      var svg = d3.select(box).append("svg").attr("viewBox", "0 0 " + W + " " + H);
      svg.selectAll("path").data(feats).enter().append("path").attr("d", path)
        .attr("fill", function (f) { var a = byNum[f.id]; return a ? stepColor(c[a]) : LANDC; })
        .attr("stroke", function (f) { return byNum[f.id] && byNum[f.id] === selC ? "#111" : EDGEC; }).attr("stroke-width", function (f) { return byNum[f.id] && byNum[f.id] === selC ? 2 : .5; })
        .style("cursor", function (f) { return byNum[f.id] ? "pointer" : "default"; })
        .on("mousemove", function (ev, f) { var a = byNum[f.id]; tip("<b>" + esc(a ? regionName(a) : (f.properties && f.properties.name) || "") + "</b>" + (a ? "<br>" + num(c[a]) + " visits · " + num((g.countryRiders || {})[a]) + " riders" : '<br><span class="muted">No visits</span>'), ev); })
        .on("mouseleave", function () { tip(null); })
        .on("click", function (ev, f) { var a = byNum[f.id]; if (a) { PLACE = Object.assign({}, PLACE, { country: a }); tip(null); draw(); } });
    }).catch(function () { var b = $("#world"); if (b) b.innerHTML = '<div class="empty">The world map could not load (it comes from a public map library).</div>'; });
  }

  // ---------- downloads ----------
  function downloadsTab(m) {
    if (!DL || DL.error) { m.innerHTML = '<div class="box"><h2>Downloads</h2><div class="empty">' + esc((DL && DL.error) || "Not loaded") + "</div></div>"; return; }
    var errs = Object.keys(DL.errors || {}).map(function (k) { return '<div class="err">' + (k.indexOf("tags") === 0 ? "Tags Generated sheet" : "TCN sheet") + ": " + esc(DL.errors[k]) + "</div>"; }).join("");
    var by = {}; rows().forEach(function (r) { by[r.id] = r; });
    var STOPOF = { Tags: "create", TCN: "n_tags", ACEO: "SMW", Negatives: "n_neg", CMYK: "n_cmyk", Enlarger: "n_enl", "Gallery Bench": "n_bench" };
    var kinds = sortObj(DL.byKind);
    var fetched = Object.keys(DL.fetched || {}).map(function (k) { return (k === "tags" ? "Tags sheet " : "TCN sheet ") + when(DL.fetched[k]); }).join(" · ");
    var colorSw = { red: "#e5483b", yellow: "#f2bf00", black: "#111", blue: "#0072ce", green: "#00964a", white: "#fff", orange: "#f28c28", purple: "#7b2d8e", pink: "#d6459b", gold: "#c9a227", silver: "#c0c0c0" };
    m.innerHTML = '<div class="cards">' + [["Downloads", sum(DL.bySheet), DL.unit === "hour" && !DL.hourly ? "" : delta(sum(DL.bySheet), DL.prev)], ["Tag makers", DL.bySheet.tags || 0], ["Network tools", DL.bySheet.tcn || 0], ["Network members using tools", DL.users || 0]].map(function (x) { return '<div class="card"><b>' + num(x[1]) + "</b><span>" + x[0] + "</span>" + (x[2] || "") + "</div>"; }).join("") + "</div>" +
      (errs ? '<div class="box"><div class="pad">' + errs + "</div></div>" : "") +
      (DL.unit === "hour" && DL.hourly === false ? '<div class="note">Downloads by hour need the updated sheet scripts. Until then the 24-hour view shows downloads for today and yesterday.</div>' : "") + trendChart() +
      '<div class="box"><h2>By maker and tool<span class="sp"></span><span class="muted">' + esc(fetched) + '</span><button id="dlr">Refresh from sheets</button></h2><table><thead><tr><th>What</th><th>Station</th><th class="n">Downloads</th><th class="n">Station visits</th><th class="n">Downloads / visit</th></tr></thead><tbody>' +
      (kinds.length ? kinds.map(function (x) { var st = STOPOF[x[0]], v = st && by[st] ? by[st].views : 0; return "<tr><td>" + esc(x[0]) + "</td><td>" + (st ? dotFor(st) + esc(nm(st)) : '<span class="muted">–</span>') + '</td><td class="n">' + num(x[1]) + '</td><td class="n">' + num(v) + '</td><td class="n">' + (v ? Math.round(100 * x[1] / v) + "%" : "–") + "</td></tr>"; }).join("") : '<tr><td colspan="5" class="empty">No downloads in this period.</td></tr>') + "</tbody></table></div>" +
      '<div class="grid2"><div class="box"><h2>Frame colours (tags)</h2>' + rankTable(DL.colors, function (k) { return '<span class="swatch" style="background:' + (colorSw[k] || "#666") + '"></span>' + esc(k); }) + "</div>" +
      '<div class="box"><h2>Formats (Network tools)</h2>' + rankTable(DL.formats, function (k) { return esc(k); }) + "</div>" +
      '<div class="box"><h2>Actions (Network tools)</h2>' + rankTable(DL.actions, function (k) { return esc(k); }) + "</div>" +
      '<div class="box"><h2>Downloaders\' timezones</h2>' + rankTable(DL.tz, function (k) { return esc(k.replace(/_/g, " ")); }) + "</div></div>";
    $("#dlr").onclick = function () { this.textContent = "Refreshing…"; getJ("/api/downloads?refresh=1&" + qs()).then(function (d) { DL = d; draw(); }); };
  }

  // ---------- riders ----------
  function ridersTab(m) {
    m.innerHTML = '<div class="grid"><div class="box"><h2>Riders <span class="muted">(anonymous' + (SUM.ridersNote ? ", " + SUM.ridersNote : "") + ')</span></h2><div style="overflow-x:auto"><table><thead><tr><th>Rider</th><th></th><th>Last seen</th><th class="n">Trips</th><th class="n">Visits</th><th class="n">Stops</th><th class="n">Sites</th><th class="n">Clicks</th></tr></thead><tbody>' +
      (RIDERS.length ? RIDERS.map(function (x) { return '<tr class="click" data-r="' + x.id + '"><td style="font-family:var(--mono)">' + x.id.slice(0, 8) + '</td><td title="' + esc(x.country ? regionName(x.country) : "") + '">' + (x.country ? flag(x.country) : "") + ' <span class="muted" style="font-size:11px">' + esc(x.dev || "") + "</span></td><td>" + when(x.last) + '</td><td class="n">' + x.sessions + '</td><td class="n">' + x.visits + '</td><td class="n">' + x.stops + '</td><td class="n">' + x.sites + '</td><td class="n">' + x.clicks + "</td></tr>"; }).join("") : '<tr><td colspan="8" class="empty">No riders yet.</td></tr>') +
      '</tbody></table></div></div><div class="box"><h2>Journey</h2><div id="jny" class="empty">Pick a rider.</div></div></div>';
    m.onclick = function (e) {
      var pb = e.target.closest("button[data-play]"); if (pb) { playTrip(JSON.parse(pb.dataset.play)); return; }
      var tr = e.target.closest("tr[data-r]"); if (!tr) return; [].forEach.call(m.querySelectorAll("tr[data-r]"), function (x) { x.classList.toggle("sel", x === tr); }); journey(tr.dataset.r);
    };
  }
  function journey(id) {
    var box = $("#jny"); box.className = ""; box.innerHTML = '<div class="empty">Loading…</div>';
    getJ("/api/rider?id=" + encodeURIComponent(id)).then(function (d) {
      box.innerHTML = '<div class="tl">' + d.sessions.map(function (s, i) {
        var stops = s.events.filter(function (e) { return (e.type === "view" || e.type === "station") && e.stop; }).map(function (e) { return e.stop; }).filter(function (x, j, a) { return j === 0 || a[j - 1] !== x; });
        var place = s.events.filter(function (e) { return e.country; })[0];
        return '<div class="sess">Trip ' + (i + 1) + " · " + when(s.start) + " · " + Math.max(1, Math.round((s.end - s.start) / 60000)) + " min" + (place ? " · " + flag(place.country) + " " + esc(place.region || regionName(place.country)) : "") + (stops.length > 1 ? " <button data-play='" + esc(JSON.stringify(stops)) + "'>Play on map</button>" : "") + "</div>" + s.events.map(function (e) {
          var what = e.type === "click" ? "Used S.We.T.A.: " + esc(e.stop === "map" ? "map" : nm(e.stop)) + " → " + esc(e.to_stop === "map" ? "map" : nm(e.to_stop)) : (e.type === "station" ? "Opened " : "Visited ") + esc(nm(e.stop)) + ' <span class="muted">' + esc((e.host || "") + (e.path || "")) + (e.ref ? " · from " + esc(e.ref) : "") + "</span>";
          return '<div class="ev ' + e.type + '"><span class="t">' + clock(e.ts) + '</span><span class="what">' + what + "</span></div>";
        }).join("");
      }).join("") + "</div>";
    }).catch(function (e) { box.innerHTML = '<div class="empty err">' + esc(e.message) + "</div>"; });
  }

  function flowsTab(m) {
    var fl = SUM.flows;
    m.innerHTML = '<div class="box"><h2>Moves between stations <span class="muted">(assisted = used the strip or map)</span></h2><div style="overflow-x:auto"><table><thead><tr><th>From</th><th>To</th><th class="n">Moves</th><th class="n">Assisted</th><th class="n">Cross-site</th><th></th></tr></thead><tbody>' +
      (fl.length ? fl.slice(0, 100).map(function (f) { return "<tr><td>" + dotFor(f.from) + esc(nm(f.from)) + "</td><td>" + dotFor(f.to) + esc(nm(f.to)) + '</td><td class="n">' + f.n + '</td><td class="n">' + f.assisted + " (" + pct(f.assisted, f.n) + ')</td><td class="n">' + f.cross + '</td><td style="width:20%"><span class="bar" style="width:' + Math.max(3, 100 * f.n / fl[0].n) + '%"></span></td></tr>'; }).join("") : '<tr><td colspan="6" class="empty">No moves counted yet.</td></tr>') + "</tbody></table></div></div>";
  }

  // Where to build: plain rules over the numbers, each with the reason shown.
  function buildOut(m) {
    var rs = rows(), items = [], total = SUM.totals.visits;
    if (total < 20) { m.innerHTML = cards() + '<div class="box"><h2>Where to build out</h2><div class="empty">Not enough rides yet. Suggestions start once there are about 20 stop visits.</div></div>'; return; }
    var live = rs.filter(function (x) { return !(META.stops[x.id] || {}).closed; });
    var avg = total / Math.max(1, live.length);
    live.forEach(function (x) {
      if (x.views >= avg * 1.5 && x.entries && x.exits / x.views > 0.7 && x.clicksOut === 0)
        items.push({ w: x.views, tag: "hot", t: "Dead end: " + x.name, d: x.views + " visits, " + pct(x.exits, x.views) + " of them end here and nobody used the strip or map. Add a visible next stop." });
      if (x.entries >= 5 && x.bounces / x.entries > 0.7)
        items.push({ w: x.entries, tag: "amber", t: "Leaves quickly: " + x.name, d: pct(x.bounces, x.entries) + " of " + x.entries + " arrivals saw only this page. The entrance may not match what people expect." });
      if (x.week >= 5 && x.prevWeek >= 5 && x.week < x.prevWeek * 0.5)
        items.push({ w: x.prevWeek - x.week, tag: "amber", t: "Dropping: " + x.name, d: x.week + " visits in the last 7 days against " + x.prevWeek + " the week before." });
      if (x.dl === 0 && ["create", "n_tags", "SMW", "n_neg", "n_cmyk", "n_enl", "n_bench"].indexOf(x.id) > -1 && x.views >= 10)
        items.push({ w: x.views, tag: "amber", t: "Visits but no downloads: " + x.name, d: x.views + " visits and no downloads counted in this period." });
    });
    var none = live.filter(function (x) { return x.views === 0; });
    if (none.length) items.push({ w: 2, tag: "", t: "No visits in the last " + PERIOD() + " (" + none.length + " stations)", d: none.map(function (x) { return x.name; }).join(", ") });
    SUM.flows.forEach(function (f) {
      var a = META.stops[f.from], b = META.stops[f.to];
      if (!a || !b || f.n < 3) return;
      var shared = a.lines.some(function (l) { return b.lines.indexOf(l) > -1; });
      var linked = (META.links || []).some(function (k) { return (k[0] === f.from && k[1] === f.to) || (k[1] === f.from && k[0] === f.to); });
      if (linked) return;
      if (!shared) items.push({ w: f.n, tag: "ok", t: "Riders already cross: " + nm(f.from) + " → " + nm(f.to), d: f.n + " moves between stops on different lines" + (f.assisted ? ", " + f.assisted + " using S.We.T.A" : "") + ". A transfer or a direct link would make this official." });
    });
    var unassisted = SUM.totals.moves - SUM.totals.assistedMoves;
    if (SUM.totals.moves >= 10 && unassisted / SUM.totals.moves > 0.7)
      items.push({ w: unassisted, tag: "amber", t: "Strip is under-used", d: pct(unassisted, SUM.totals.moves) + " of moves between stops did not go through the strip or map." });
    items.sort(function (a, b) { return b.w - a.w; });
    m.innerHTML = cards() + '<div class="box build"><h2>Where to build out <span class="muted">(rules on the numbers, not predictions)</span></h2>' +
      (items.length ? items.slice(0, 30).map(function (i) { return '<div class="it"><b>' + esc(i.t) + (i.tag ? ' <span class="pill ' + i.tag + '">' + (i.tag === "hot" ? "fix" : i.tag === "ok" ? "opportunity" : "watch") + "</span>" : "") + '</b><span class="muted">' + esc(i.d) + "</span></div>"; }).join("") : '<div class="empty">Nothing stands out.</div>') + "</div>";
  }

  function download(fmt) {
    api("/api/export?days=" + days() + "&format=" + fmt).then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "sweta-events." + fmt; document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { var b = $("#" + fmt); if (b) { b.textContent = "Export failed"; setTimeout(function () { b.textContent = "Export " + fmt.toUpperCase(); }, 2500); } });
  }
  $("#refresh").onclick = function () { FRESH = true; load(); };
  $("#csv").onclick = function () { download("csv"); }; $("#json").onclick = function () { download("json"); };
  load();
})();
</script>
</body>
</html>
