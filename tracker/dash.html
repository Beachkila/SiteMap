<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>S.We.T.A. Ridership</title>
<style>
:root{--bg:#121211;--panel:#1b1b19;--panel2:#252522;--ink:#ecebe6;--muted:#9a9a93;--rule:#34342f;--accent:#f2b134;--hot:#e5483b;--ok:#6fbf73;--live:#4fd1c5;
  --mono:ui-monospace,Menlo,Consolas,monospace;--sans:"Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-bottom:3px solid var(--ink)}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.sp{flex:1}
select,button,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#liveTag{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
#liveTag i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
#liveTag.on i{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:beat 1.6s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(79,209,197,.6)}70%{box-shadow:0 0 0 8px rgba(79,209,197,0)}100%{box-shadow:0 0 0 0 rgba(79,209,197,0)}}
nav{display:flex;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--rule);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted);font-weight:700;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:24px;font-family:var(--mono);line-height:1.1}
.card span{color:var(--muted);font-size:12px}
.card em{font-style:normal;font-size:11px;font-family:var(--mono);margin-left:6px}
.up{color:var(--ok)}.down{color:var(--hot)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:16px}
.box h2{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box h2 .sp{flex:1}
.pad{padding:10px 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td,tr.sel td{background:var(--panel2)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;min-width:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.pill.hot{color:var(--hot);border-color:var(--hot)}.pill.amber{color:var(--accent);border-color:var(--accent)}.pill.ok{color:var(--ok);border-color:var(--ok)}
.muted{color:var(--muted)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.err{color:var(--hot)}
/* map */
.mapwrap{position:relative;height:620px;background:#0d0d0c;touch-action:none}
.mapwrap svg{display:block;width:100%;height:100%;cursor:grab}
.mapwrap svg.drag{cursor:grabbing}
.tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:13px}
.tools label{display:flex;align-items:center;gap:5px;color:var(--muted)}
.tools select{padding:3px 6px}
.tools .seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tools .seg button{border:0;border-radius:0;padding:3px 9px;background:var(--panel2)}
.tools .seg button.on{background:var(--ink);color:var(--bg)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;padding:0;font-size:18px;font-weight:700}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(18,18,17,.88);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12px;max-width:360px}
.legend .grad{height:10px;border-radius:5px;margin:4px 0 2px;width:220px}
.legend .row{display:flex;justify-content:space-between;width:220px;font-family:var(--mono);color:var(--muted)}
.lbl{font:600 12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#0d0d0c;stroke-width:3px;pointer-events:none}
.side h3{margin:0 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-family:var(--mono);font-size:17px}
.kv span{font-size:11px;color:var(--muted)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule);font-size:13px}
.list li .n{margin-left:auto;font-family:var(--mono)}
.feed li{animation:fadein .6s}
@keyframes fadein{from{background:rgba(79,209,197,.25)}to{background:transparent}}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 0 0}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.cols span{font-size:10px;color:var(--muted);font-family:var(--mono)}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:5px}
.keys b{width:10px;height:10px;border-radius:3px;display:inline-block}
.world{height:440px;background:#0d0d0c}
.world svg{width:100%;height:100%;display:block}
.world path{stroke:#0d0d0c;stroke-width:.5}
.tl{padding:8px 12px 12px}
.tl .sess{margin:10px 0 4px;font-weight:700;font-size:12px;color:var(--accent);font-family:var(--mono);display:flex;gap:8px;align-items:center}
.tl .ev{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:3px 0 3px 12px;border-left:2px solid var(--rule);font-size:13px}
.tl .ev .t{white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:12px}
.tl .ev.click{border-left-color:var(--accent)}
.tl .ev.click .what{color:var(--accent)}
.build .it{padding:10px 12px;border-bottom:1px solid var(--rule)}
.build .it:last-child{border:0}
.build .it b{display:block}
#login{max-width:420px;margin:60px auto;padding:20px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
#login input{width:100%;margin:10px 0}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-size:12px;z-index:9;display:none}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--rule);vertical-align:-2px;margin-right:6px}
</style>
</head>

  <h1>S.We.T.A. Ridership<small>private</small></h1>

  <span class="sp"></span>
  <label class="muted">Period <select id="days"><option value="1">24 hours</option><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></label>
  <button id="refresh">Refresh</button>
  <button id="csv">Export CSV</button>
  <button id="json">Export JSON</button>

<main id="main"></main>
<div class="tip" id="tip"></div>

      if (!a || !b || f.n < 3) return;
      var shared = a.lines.some(function (l) { return b.lines.indexOf(l) > -1; });
      var linked = (META.links || []).some(function (k) { return (k[0] === f.from && k[1] === f.to) || (k[1] === f.from && k[0] === f.to); });
      if (linked) return;
      if (!shared) items.push({ w: f.n, tag: "ok", t: "Riders already cross: " + nm(f.from) + " → " + nm(f.to), d: f.n + " moves between stops on different lines" + (f.assisted ? ", " + f.assisted + " using S.We.T.A" : "") + ". A transfer or a direct link would make this official." });
    });
    var unassisted = SUM.totals.moves - SUM.totals.assistedMoves;
    if (SUM.totals.moves >= 10 && unassisted / SUM.totals.moves > 0.7)
      items.push({ w: unassisted, tag: "amber", t: "Strip is under-used", d: pct(unassisted, SUM.totals.moves) + " of moves between stops did not go through the strip or map." });
    items.sort(function (a, b) { return b.w - a.w; });
    m.innerHTML = cards() + '<div class="box build"><h2>Where to build out <span class="muted">(rules on the numbers, not predictions)</span></h2>' +
      (items.length ? items.slice(0, 30).map(function (i) { return '<div class="it"><b>' + esc(i.t) + (i.tag ? ' <span class="pill ' + i.tag + '">' + (i.tag === "hot" ? "fix" : i.tag === "ok" ? "opportunity" : "watch") + "</span>" : "") + '</b><span class="muted">' + esc(i.d) + "</span></div>"; }).join("") : '<div class="empty">Nothing stands out.</div>') + "</div>";
  }

  function download(fmt) {
    api("/api/export?days=" + days() + "&format=" + fmt).then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "sweta-events." + fmt; document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { var b = $("#" + fmt); if (b) { b.textContent = "Export failed"; setTimeout(function () { b.textContent = "Export " + fmt.toUpperCase(); }, 2500); } });
  }
  $("#refresh").onclick = load; $("#days").onchange = load;
  $("#csv").onclick = function () { download("csv"); }; $("#json").onclick = function () { download("json"); };
  load();
})();
</script>
